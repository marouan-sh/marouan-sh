<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
<defs>
  <style>
  .b1{animation:m1 14s ease-in-out infinite alternate}
  .b2{animation:m2 17s ease-in-out infinite alternate}
  .b3{animation:m3 12s ease-in-out infinite alternate}
  .b4{animation:m4 19s ease-in-out infinite alternate}
  @keyframes m1{to{transform:translate(100px,25px)}}
  @keyframes m2{to{transform:translate(-100px,-60px)}}
  @keyframes m3{to{transform:translate(-60px,25px)}}
  @keyframes m4{to{transform:translate(60px,-25px)}}
</style>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  <clipPath id="frame"><rect width="1200" height="150" rx="22"/></clipPath>
  <clipPath id="pane"><rect x="60" y="20" width="1080" height="110" rx="26"/></clipPath>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
    <stop offset=".7" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#93c5fd" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
  </linearGradient>
  <radialGradient id="spec" cx=".22" cy="0" r=".7">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="150" fill="#0b1120"/>
  <g filter="url(#soft)" opacity=".85">
    <circle class="b1" cx="216.0" cy="45.0" r="82.5" fill="#2563eb"/>
    <circle class="b2" cx="983.9999999999999" cy="112.5" r="75.0" fill="#06b6d4"/>
    <circle class="b3" cx="660.0" cy="7.5" r="63.0" fill="#6366f1"/>
    <circle class="b4" cx="480.0" cy="150.0" r="52.5" fill="#64748b"/></g>
  <rect x="60" y="20" width="1080" height="110" rx="26" fill="#0b1120" opacity=".25" filter="url(#shadow)"/>
  <g clip-path="url(#pane)">
    <rect x="60" y="20" width="1080" height="110" fill="#0b1120"/>
    <g filter="url(#frost)" opacity=".95">
    <circle class="b1" cx="216.0" cy="45.0" r="82.5" fill="#2563eb"/>
    <circle class="b2" cx="983.9999999999999" cy="112.5" r="75.0" fill="#06b6d4"/>
    <circle class="b3" cx="660.0" cy="7.5" r="63.0" fill="#6366f1"/>
    <circle class="b4" cx="480.0" cy="150.0" r="52.5" fill="#64748b"/></g>
    <rect x="60" y="20" width="1080" height="110" fill="url(#sheen)"/>
    <rect x="60" y="20" width="1080" height="110" fill="url(#spec)"/>
  </g>
  <rect x="60.75" y="20.75" width="1078.5" height="108.5" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  
  <text x="600.0" y="70" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Si no lo entiendo, no lo subo.</text>
  <text x="600.0" y="100" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Gracias por pasarte · Marouan Sanhaji</text>

</g>
</svg>