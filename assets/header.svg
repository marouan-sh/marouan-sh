<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <style>
  .b1{animation:m1 14s ease-in-out infinite alternate}
  .b2{animation:m2 17s ease-in-out infinite alternate}
  .b3{animation:m3 12s ease-in-out infinite alternate}
  .b4{animation:m4 19s ease-in-out infinite alternate}
  @keyframes m1{to{transform:translate(120px,60px)}}
  @keyframes m2{to{transform:translate(-120px,-90px)}}
  @keyframes m3{to{transform:translate(-90px,60px)}}
  @keyframes m4{to{transform:translate(90px,-60px)}}
</style>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  <clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath>
  <clipPath id="pane"><rect x="110" y="70" width="980" height="280" rx="34"/></clipPath>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
    <stop offset=".7" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#93c5fd" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
  </linearGradient>
  <radialGradient id="spec" cx=".22" cy="0" r=".7">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="420" fill="#0b1120"/>
  <g filter="url(#soft)" opacity=".85">
    <circle class="b1" cx="216.0" cy="126.0" r="231.00000000000003" fill="#2563eb"/>
    <circle class="b2" cx="983.9999999999999" cy="315.0" r="210.0" fill="#06b6d4"/>
    <circle class="b3" cx="660.0" cy="21.0" r="176.4" fill="#6366f1"/>
    <circle class="b4" cx="480.0" cy="420.0" r="147.0" fill="#64748b"/></g>
  <rect x="110" y="70" width="980" height="280" rx="34" fill="#0b1120" opacity=".25" filter="url(#shadow)"/>
  <g clip-path="url(#pane)">
    <rect x="110" y="70" width="980" height="280" fill="#0b1120"/>
    <g filter="url(#frost)" opacity=".95">
    <circle class="b1" cx="216.0" cy="126.0" r="231.00000000000003" fill="#2563eb"/>
    <circle class="b2" cx="983.9999999999999" cy="315.0" r="210.0" fill="#06b6d4"/>
    <circle class="b3" cx="660.0" cy="21.0" r="176.4" fill="#6366f1"/>
    <circle class="b4" cx="480.0" cy="420.0" r="147.0" fill="#64748b"/></g>
    <rect x="110" y="70" width="980" height="280" fill="url(#sheen)"/>
    <rect x="110" y="70" width="980" height="280" fill="url(#spec)"/>
  </g>
  <rect x="110.75" y="70.75" width="978.5" height="278.5" rx="34" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  
  <text x="170" y="140" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="#93c5fd">HOLA, SOY</text>
  <text x="166" y="210" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#fff" letter-spacing="-1.5">Marouan Sanhaji</text>
  <text x="170" y="252" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#cbd5e1">Desarrollador de Aplicaciones Multiplataforma · INS Marianao</text>
<rect x="170" y="282" width="86" height="34" rx="17.0" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity=".22"/><text x="213" y="304" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Kotlin</text><rect x="266.0" y="282" width="95" height="34" rx="17.0" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity=".22"/><text x="314" y="304" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Android</text><rect x="371.0" y="282" width="68" height="34" rx="17.0" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity=".22"/><text x="405" y="304" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Java</text><rect x="449.0" y="282" width="59" height="34" rx="17.0" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity=".22"/><text x="478" y="304" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">PHP</text><rect x="518.0" y="282" width="77" height="34" rx="17.0" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity=".22"/><text x="556" y="304" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">MySQL</text><rect x="605.0" y="282" width="95" height="34" rx="17.0" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity=".22"/><text x="652" y="304" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">MongoDB</text>
  <circle cx="1020" cy="132" r="7" fill="#22d3ee"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1020" cy="132" r="7" fill="none" stroke="#22d3ee" stroke-width="2"><animate attributeName="r" values="7;18" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle>

</g>
</svg>