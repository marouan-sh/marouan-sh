<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs>
  <style>
  .b1{animation:m1 14s ease-in-out infinite alternate}
  .b2{animation:m2 17s ease-in-out infinite alternate}
  .b3{animation:m3 12s ease-in-out infinite alternate}
  .b4{animation:m4 19s ease-in-out infinite alternate}
  @keyframes m1{to{transform:translate(110px,50px)}}
  @keyframes m2{to{transform:translate(-110px,-80px)}}
  @keyframes m3{to{transform:translate(-80px,50px)}}
  @keyframes m4{to{transform:translate(80px,-50px)}}
</style>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  <clipPath id="frame"><rect width="1200" height="470" rx="22"/></clipPath>
  <clipPath id="pane"><rect x="60" y="30" width="1080" height="410" rx="26"/></clipPath>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
    <stop offset=".7" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#93c5fd" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
  </linearGradient>
  <radialGradient id="spec" cx=".22" cy="0" r=".7">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="470" fill="#0b1120"/>
  <g filter="url(#soft)" opacity=".85">
    <circle class="b1" cx="216.0" cy="141.0" r="258.5" fill="#2563eb"/>
    <circle class="b2" cx="983.9999999999999" cy="352.5" r="235.0" fill="#06b6d4"/>
    <circle class="b3" cx="660.0" cy="23.5" r="197.4" fill="#6366f1"/>
    <circle class="b4" cx="480.0" cy="470.0" r="164.5" fill="#64748b"/></g>
  <rect x="60" y="30" width="1080" height="410" rx="26" fill="#0b1120" opacity=".25" filter="url(#shadow)"/>
  <g clip-path="url(#pane)">
    <rect x="60" y="30" width="1080" height="410" fill="#0b1120"/>
    <g filter="url(#frost)" opacity=".95">
    <circle class="b1" cx="216.0" cy="141.0" r="258.5" fill="#2563eb"/>
    <circle class="b2" cx="983.9999999999999" cy="352.5" r="235.0" fill="#06b6d4"/>
    <circle class="b3" cx="660.0" cy="23.5" r="197.4" fill="#6366f1"/>
    <circle class="b4" cx="480.0" cy="470.0" r="164.5" fill="#64748b"/></g>
    <rect x="60" y="30" width="1080" height="410" fill="url(#sheen)"/>
    <rect x="60" y="30" width="1080" height="410" fill="url(#spec)"/>
  </g>
  <rect x="60.75" y="30.75" width="1078.5" height="408.5" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  
  <line x1="60" y1="88" x2="1140" y2="88" stroke="#fff" stroke-opacity=".14"/>
  <circle cx="92" cy="59" r="7.5" fill="#f87171"/>
  <circle cx="116" cy="59" r="7.5" fill="#fbbf24"/>
  <circle cx="140" cy="59" r="7.5" fill="#4ade80"/>
  <text x="600.0" y="65" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1">SobreMi.kt</text>
  <text x="108" y="142" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">1</text><text x="132" y="142" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#c084fc">data class </tspan><tspan fill="#fbbf24">Marouan</tspan><tspan fill="#e2e8f0">(</tspan></text><text x="108" y="171" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">2</text><text x="132" y="171" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#c084fc">    val </tspan><tspan fill="#93c5fd">rol</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#86efac">&quot;Estudiante de CFGS DAM&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text><text x="108" y="200" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">3</text><text x="132" y="200" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#c084fc">    val </tspan><tspan fill="#93c5fd">centro</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#86efac">&quot;INS Marianao&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text><text x="108" y="229" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">4</text><text x="132" y="229" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#c084fc">    val </tspan><tspan fill="#93c5fd">ubicacion</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#86efac">&quot;Barcelona, España&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text><text x="108" y="258" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">5</text><text x="132" y="258" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#c084fc">    val </tspan><tspan fill="#93c5fd">idiomas</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#fbbf24">listOf</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">&quot;Español&quot;</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">&quot;Árabe&quot;</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">&quot;Inglés&quot;</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">&quot;Francés&quot;</tspan><tspan fill="#e2e8f0">),</tspan></text><text x="108" y="287" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">6</text><text x="132" y="287" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#c084fc">    val </tspan><tspan fill="#93c5fd">filosofia</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#fbbf24">listOf</tspan><tspan fill="#e2e8f0">(</tspan></text><text x="108" y="316" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">7</text><text x="132" y="316" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#e2e8f0">        </tspan><tspan fill="#86efac">&quot;Menos copiar y pegar, más entender por qué funciona&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text><text x="108" y="345" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">8</text><text x="132" y="345" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#e2e8f0">        </tspan><tspan fill="#86efac">&quot;Si no lo entiendo, no lo subo&quot;</tspan></text><text x="108" y="374" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">9</text><text x="132" y="374" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#e2e8f0">    )</tspan></text><text x="108" y="403" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#cbd5e1" fill-opacity=".45" text-anchor="end">10</text><text x="132" y="403" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" xml:space="preserve"><tspan fill="#e2e8f0">)</tspan></text>
  <rect x="147" y="386" width="10" height="21" fill="#93c5fd"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

</g>
</svg>