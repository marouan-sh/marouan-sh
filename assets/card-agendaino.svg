<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300">
<defs>
  <style>
  .b1{animation:m1 14s ease-in-out infinite alternate}
  .b2{animation:m2 17s ease-in-out infinite alternate}
  .b3{animation:m3 12s ease-in-out infinite alternate}
  .b4{animation:m4 19s ease-in-out infinite alternate}
  @keyframes m1{to{transform:translate(60px,40px)}}
  @keyframes m2{to{transform:translate(-60px,-50px)}}
  @keyframes m3{to{transform:translate(-50px,40px)}}
  @keyframes m4{to{transform:translate(50px,-40px)}}
</style>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  <clipPath id="frame"><rect width="580" height="300" rx="22"/></clipPath>
  <clipPath id="pane"><rect x="14" y="14" width="552" height="272" rx="24"/></clipPath>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
    <stop offset=".7" stop-color="#fff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#93c5fd" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
  </linearGradient>
  <radialGradient id="spec" cx=".22" cy="0" r=".7">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="580" height="300" fill="#0b1120"/>
  <g filter="url(#soft)" opacity=".85">
    <circle class="b1" cx="104.39999999999999" cy="90.0" r="165.0" fill="#2563eb"/>
    <circle class="b2" cx="475.59999999999997" cy="225.0" r="150.0" fill="#06b6d4"/>
    <circle class="b3" cx="319.0" cy="15.0" r="126.0" fill="#6366f1"/>
    <circle class="b4" cx="232.0" cy="300.0" r="105.0" fill="#64748b"/></g>
  <rect x="14" y="14" width="552" height="272" rx="24" fill="#0b1120" opacity=".25" filter="url(#shadow)"/>
  <g clip-path="url(#pane)">
    <rect x="14" y="14" width="552" height="272" fill="#0b1120"/>
    <g filter="url(#frost)" opacity=".95">
    <circle class="b1" cx="104.39999999999999" cy="90.0" r="165.0" fill="#2563eb"/>
    <circle class="b2" cx="475.59999999999997" cy="225.0" r="150.0" fill="#06b6d4"/>
    <circle class="b3" cx="319.0" cy="15.0" r="126.0" fill="#6366f1"/>
    <circle class="b4" cx="232.0" cy="300.0" r="105.0" fill="#64748b"/></g>
    <rect x="14" y="14" width="552" height="272" fill="url(#sheen)"/>
    <rect x="14" y="14" width="552" height="272" fill="url(#spec)"/>
  </g>
  <rect x="14.75" y="14.75" width="550.5" height="270.5" rx="24" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  
  <rect x="44" y="44" width="6" height="34" rx="3" fill="#22d3ee"/>
  <text x="64" y="58" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#f1f5f9" fill-opacity=".85">PROYECTO PERSONAL · IA</text>
  <text x="44" y="118" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#fff">Agendaino</text>
<text x="44" y="154" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="16.5" fill="#cbd5e1">Agenda escolar por asignaturas para mi clase de DAM:</text><text x="44" y="178" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="16.5" fill="#cbd5e1">tareas, apuntes, exámenes con temario y avisos al</text><text x="44" y="202" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="16.5" fill="#cbd5e1">móvil. Hecha con vibe coding junto a una IA.</text><rect x="44" y="230" width="102" height="28" rx="14.0" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity=".22"/><text x="95" y="249" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">JavaScript</text><rect x="154.0" y="230" width="86" height="28" rx="14.0" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity=".22"/><text x="197" y="249" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Supabase</text><rect x="248.4" y="230" width="47" height="28" rx="14.0" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity=".22"/><text x="272" y="249" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">PWA</text><rect x="416" y="228" width="120" height="32" rx="16" fill="#22d3ee" fill-opacity=".85"/><text x="476" y="249" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Abrir app →</text>
</g>
</svg>